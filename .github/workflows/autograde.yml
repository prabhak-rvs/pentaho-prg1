name: SQL Assignment Autograding

on:
  push:
    paths:
      - "answers.sql"
      - ".github/workflows/autograde.yml"
  workflow_dispatch:

jobs:
  autograde:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check answers.sql
        run: |
          if [ ! -f "answers.sql" ]; then
            echo "FAIL: answers.sql not found"
            exit 1
          fi
          echo "PASS: answers.sql found"

      - name: Check SQL requirements
        run: |
          file="answers.sql"

          grep -Eiq "SUM[[:space:]]*\(" "$file" || { echo "FAIL: SUM() missing"; exit 1; }
          grep -Eiq "AVG[[:space:]]*\(" "$file" || { echo "FAIL: AVG() missing"; exit 1; }
          grep -Eiq "total_sales" "$file" || { echo "FAIL: total_sales missing"; exit 1; }
          grep -Eiq "avg_sales" "$file" || { echo "FAIL: avg_sales missing"; exit 1; }

          grep -Eiq "COUNT[[:space:]]*\(" "$file" || { echo "FAIL: COUNT() missing"; exit 1; }
          grep -Eiq "GROUP[[:space:]]+BY" "$file" || { echo "FAIL: GROUP BY missing"; exit 1; }
          grep -Eiq "ORDER[[:space:]]+BY" "$file" || { echo "FAIL: ORDER BY missing"; exit 1; }
          grep -Eiq "DESC" "$file" || { echo "FAIL: DESC missing"; exit 1; }

          grep -Eiq "Atlantic" "$file" || { echo "FAIL: Atlantic missing"; exit 1; }
          grep -Eiq "TABLES" "$file" || { echo "FAIL: TABLES missing"; exit 1; }

          grep -Eiq "product_id" "$file" || { echo "FAIL: product_id missing"; exit 1; }
          grep -Eiq "customer_name" "$file" || { echo "FAIL: customer_name missing"; exit 1; }

          echo "ALL CHECKS PASSED"
